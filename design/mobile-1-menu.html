<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Menu de partie · Dart Counter (maquette)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #0e0e0e;
      }
      a {
        color: #efdcb0;
      }
      a:hover {
        color: #ffffff;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
    </style>
    <style>
      #app {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <!-- Maquette Dart Counter : référence visuelle et comportementale, pas du code de production. -->
    <div id="app"></div>
    <template id="tpl">
      <div
        style="
          position: relative;
          width: 390px;
          height: 844px;
          box-sizing: border-box;
          background: #0e0e0e;
          color: #f4f1ea;
          font-family: Barlow, sans-serif;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        "
      >
        <header style="display: flex; align-items: center; gap: 12px; padding: 28px 20px 8px">
          <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
            <circle
              cx="20"
              cy="20"
              r="19"
              fill="#151515"
              stroke="#3A3A3A"
              stroke-width="1"
            ></circle>
            <circle cx="20" cy="20" r="15" fill="none" stroke="#D9261C" stroke-width="3"></circle>
            <circle cx="20" cy="20" r="9" fill="none" stroke="#0B8A3C" stroke-width="3"></circle>
            <circle cx="20" cy="20" r="3.5" fill="#D9261C"></circle>
          </svg>
          <h1
            style="
              margin: 0;
              font-family: 'Barlow Condensed', sans-serif;
              font-weight: 800;
              font-size: 34px;
              letter-spacing: 0.04em;
              line-height: 1;
              text-transform: uppercase;
              color: #efdcb0;
            "
          >
            Dart<span style="color: #d9261c">Counter</span>
          </h1>
        </header>

        <main
          style="
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 28px;
            padding: 20px;
            overflow-y: auto;
          "
        >
          <section style="display: flex; flex-direction: column; gap: 12px">
            <h2
              style="
                margin: 0;
                font-family: 'Barlow Condensed', sans-serif;
                font-weight: 700;
                font-size: 15px;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: #9a9a9a;
              "
            >
              Type de partie
            </h2>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
              <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
                <button
                  type="button"
                  aria-pressed="{{m.pressed}}"
                  onClick="{{m.pick}}"
                  style="{{m.style}}"
                >
                  <span
                    style="
                      display: block;
                      font-family: 'Barlow Condensed', sans-serif;
                      font-weight: 800;
                      font-size: 56px;
                      line-height: 1;
                    "
                    >{{m.id}}</span
                  >
                  <span
                    style="
                      display: block;
                      font-size: 13px;
                      font-weight: 600;
                      letter-spacing: 0.06em;
                      text-transform: uppercase;
                      margin-top: 6px;
                      opacity: 0.85;
                    "
                    >Double out</span
                  >
                </button>
              </sc-for>
            </div>
          </section>

          <section style="display: flex; flex-direction: column; gap: 12px">
            <div style="display: flex; align-items: baseline; justify-content: space-between">
              <h2
                style="
                  margin: 0;
                  font-family: 'Barlow Condensed', sans-serif;
                  font-weight: 700;
                  font-size: 15px;
                  letter-spacing: 0.12em;
                  text-transform: uppercase;
                  color: #9a9a9a;
                "
              >
                Joueurs
              </h2>
              <span style="font-size: 14px; color: #efdcb0; font-weight: 600"
                >{{selCount}} sélectionnés</span
              >
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <sc-for list="{{players}}" as="p" hint-placeholder-count="4">
                <button
                  type="button"
                  aria-pressed="{{p.pressed}}"
                  onClick="{{p.toggle}}"
                  style="{{p.rowStyle}}"
                >
                  <span style="{{p.avatarStyle}}">{{p.ini}}</span>
                  <span
                    style="
                      flex: 1;
                      display: flex;
                      flex-direction: column;
                      align-items: flex-start;
                      gap: 2px;
                      min-width: 0;
                    "
                  >
                    <span style="font-size: 17px; font-weight: 600">{{p.name}}</span>
                    <span style="font-size: 13px; color: #9a9a9a">« {{p.nick}} »</span>
                  </span>
                  <sc-if value="{{p.selected}}" hint-placeholder-val="{{true}}">
                    <span
                      style="
                        width: 32px;
                        height: 32px;
                        border-radius: 16px;
                        background: #d9261c;
                        color: #ffffff;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-family: 'Barlow Condensed', sans-serif;
                        font-weight: 800;
                        font-size: 18px;
                      "
                      ><svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="3"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                      >
                        <path d="M5 12.5l4.5 4.5L19 7.5"></path></svg
                    ></span>
                  </sc-if>
                  <sc-if value="{{p.unselected}}" hint-placeholder-val="{{false}}">
                    <span
                      style="
                        width: 32px;
                        height: 32px;
                        border-radius: 16px;
                        border: 2px solid #4a4a4a;
                        box-sizing: border-box;
                      "
                    ></span>
                  </sc-if>
                </button>
              </sc-for>
              <a
                href="mobile-2-nouveau-joueur.html"
                style="
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  gap: 8px;
                  min-height: 56px;
                  border: 2px dashed #4a4a4a;
                  border-radius: 14px;
                  color: #efdcb0;
                  text-decoration: none;
                  font-weight: 600;
                  font-size: 16px;
                "
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  aria-hidden="true"
                >
                  <path d="M12 5v14M5 12h14"></path>
                </svg>
                Créer un joueur
              </a>
            </div>
          </section>
        </main>

        <footer
          style="
            padding: 12px 20px 28px;
            border-top: 1px solid #222222;
            display: flex;
            flex-direction: column;
            gap: 8px;
          "
        >
          <span style="font-size: 13px; color: #9a9a9a; text-align: center"
            >L'ordre de passage est tiré au sort au lancement</span
          >
          <button
            type="button"
            onClick="{{draw}}"
            disabled="{{cannotLaunch}}"
            style="{{launchStyle}}"
          >
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="3" width="18" height="18" rx="4"></rect>
              <circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"></circle>
              <circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"></circle>
              <circle cx="12" cy="12" r="1.2" fill="currentColor"></circle>
            </svg>
            Tirer au sort · {{mode}}
          </button>
        </footer>

        <sc-if value="{{showDraw}}" hint-placeholder-val="{{false}}">
          <div
            style="
              position: absolute;
              inset: 0;
              background: rgba(0, 0, 0, 0.72);
              display: flex;
              align-items: flex-end;
            "
          >
            <div
              role="dialog"
              aria-label="Ordre de passage"
              style="
                width: 100%;
                box-sizing: border-box;
                background: #161616;
                border-top: 3px solid #d9261c;
                border-radius: 24px 24px 0 0;
                padding: 24px 20px 28px;
                display: flex;
                flex-direction: column;
                gap: 12px;
              "
            >
              <div style="display: flex; align-items: baseline; justify-content: space-between">
                <h2
                  style="
                    margin: 0;
                    font-family: 'Barlow Condensed', sans-serif;
                    font-weight: 800;
                    font-size: 28px;
                    letter-spacing: 0.04em;
                    text-transform: uppercase;
                    color: #efdcb0;
                  "
                >
                  Ordre de passage
                </h2>
                <span style="font-size: 13px; color: #9a9a9a; font-weight: 600"
                  >Tirage n° {{drawCount}}</span
                >
              </div>
              <ol
                style="
                  margin: 0;
                  padding: 0;
                  list-style: none;
                  display: flex;
                  flex-direction: column;
                  gap: 8px;
                "
              >
                <sc-for list="{{drawn}}" as="d" hint-placeholder-count="3">
                  <li style="{{d.rowStyle}}">
                    <span
                      style="
                        width: 28px;
                        font-family: 'Barlow Condensed', sans-serif;
                        font-weight: 800;
                        font-size: 30px;
                        color: #efdcb0;
                        text-align: center;
                      "
                      >{{d.rank}}</span
                    >
                    <span style="{{d.avatarStyle}}">{{d.ini}}</span>
                    <span style="flex: 1; font-size: 18px; font-weight: 600">{{d.name}}</span>
                    <sc-if value="{{d.first}}" hint-placeholder-val="{{false}}">
                      <span
                        style="
                          padding: 4px 10px;
                          border-radius: 8px;
                          background: #d9261c;
                          color: #ffffff;
                          font-size: 12px;
                          font-weight: 700;
                          letter-spacing: 0.08em;
                          text-transform: uppercase;
                        "
                        >Commence</span
                      >
                    </sc-if>
                  </li>
                </sc-for>
              </ol>
              <div
                style="
                  display: grid;
                  grid-template-columns: repeat(2, minmax(0, 1fr));
                  gap: 10px;
                  margin-top: 6px;
                "
              >
                <button
                  type="button"
                  onClick="{{draw}}"
                  style="
                    min-height: 56px;
                    border-radius: 14px;
                    background: #1f1f1f;
                    border: 1px solid #3a3a3a;
                    color: #efdcb0;
                    font-family: 'Barlow Condensed', sans-serif;
                    font-weight: 800;
                    font-size: 20px;
                    letter-spacing: 0.05em;
                    text-transform: uppercase;
                  "
                >
                  Relancer
                </button>
                <a
                  href="mobile-3-partie.html"
                  style="
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    min-height: 56px;
                    border-radius: 14px;
                    background: #d9261c;
                    color: #ffffff;
                    text-decoration: none;
                    font-family: 'Barlow Condensed', sans-serif;
                    font-weight: 800;
                    font-size: 20px;
                    letter-spacing: 0.05em;
                    text-transform: uppercase;
                  "
                  >C'est parti</a
                >
              </div>
              <button
                type="button"
                onClick="{{closeDraw}}"
                style="
                  min-height: 44px;
                  background: transparent;
                  border: 0;
                  color: #9a9a9a;
                  font-size: 15px;
                  font-weight: 600;
                "
              >
                Modifier la sélection
              </button>
            </div>
          </div>
        </sc-if>
      </div>
    </template>
    <script>
      /* Mini runtime: renders a Design Component template (holes, sc-for, sc-if, events) as a standalone page. */
      (function () {
        var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
        var WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
        function lookup(path, scope) {
          if (path === 'true') return true;
          if (path === 'false') return false;
          if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
          var parts = path.split('.'),
            v = scope;
          for (var i = 0; i < parts.length; i++) {
            if (v == null) return undefined;
            v = v[parts[i]];
          }
          return v;
        }
        function interp(str, scope) {
          return str.replace(HOLE, function (_, p) {
            var v = lookup(p, scope);
            return v == null ? '' : String(v);
          });
        }
        function renderNodes(nodes, scope, out) {
          for (var i = 0; i < nodes.length; i++) renderNode(nodes[i], scope, out);
          return out;
        }
        function renderNode(node, scope, out) {
          if (node.nodeType === 3) {
            out.push(document.createTextNode(interp(node.nodeValue, scope)));
            return;
          }
          if (node.nodeType !== 1) return;
          var tag = node.localName;
          if (tag === 'sc-for') {
            var list =
              lookup((WHOLE.exec(node.getAttribute('list') || '') || [])[1] || '', scope) || [];
            var as = node.getAttribute('as') || 'item';
            list.forEach(function (item, idx) {
              var s = Object.create(scope);
              s[as] = item;
              s.$index = idx;
              renderNodes(node.childNodes, s, out);
            });
            return;
          }
          if (tag === 'sc-if') {
            var cond = lookup((WHOLE.exec(node.getAttribute('value') || '') || [])[1] || '', scope);
            if (cond) renderNodes(node.childNodes, scope, out);
            return;
          }
          var el =
            node.namespaceURI === 'http://www.w3.org/1999/xhtml'
              ? document.createElement(tag)
              : document.createElementNS(node.namespaceURI, node.tagName);
          for (var a = 0; a < node.attributes.length; a++) {
            var at = node.attributes[a],
              name = at.name,
              val = at.value;
            if (name.indexOf('hint-') === 0) continue;
            var m = WHOLE.exec(val);
            if (name.indexOf('on') === 0 && m) {
              var fn = lookup(m[1], scope);
              if (typeof fn === 'function') el.addEventListener(name.slice(2), fn);
              continue;
            }
            if (name === 'href' && /\.dc\.html$/.test(val))
              val = val.replace(/\.dc\.html$/, '.html');
            if (m) {
              var raw = lookup(m[1], scope);
              if (raw === false || raw == null) continue;
              el.setAttribute(name, raw === true ? '' : String(raw));
            } else {
              el.setAttribute(name, val.indexOf('{{') >= 0 ? interp(val, scope) : val);
            }
          }
          var src = tag === 'template' ? node.content.childNodes : node.childNodes;
          renderNodes(src, scope, []).forEach(function (c) {
            el.appendChild(c);
          });
          out.push(el);
        }
        var mount,
          tpl,
          inst,
          queued = false;
        function render() {
          queued = false;
          var vals = inst.renderVals();
          var nodes = renderNodes(tpl.content.childNodes, vals, []);
          mount.replaceChildren.apply(mount, nodes);
        }
        window.DCLogic = function DCLogic(props) {
          this.props = props || {};
          this.state = {};
        };
        window.DCLogic.prototype.setState = function (patch) {
          this.state = Object.assign(
            {},
            this.state,
            typeof patch === 'function' ? patch(this.state, this.props) : patch,
          );
          if (!queued) {
            queued = true;
            Promise.resolve().then(render);
          }
        };
        window.DCLogic.prototype.forceUpdate = function () {
          if (!queued) {
            queued = true;
            Promise.resolve().then(render);
          }
        };
        window.__dcStart = function (Component) {
          mount = document.getElementById('app');
          tpl = document.getElementById('tpl');
          inst = new Component({});
          render();
          if (inst.componentDidMount) inst.componentDidMount();
        };
      })();
    </script>
    <script>
      class Component extends DCLogic {
        constructor(props) {
          super(props);
          this.state = { mode: '501', sel: ['lea', 'max', 'soph'], drawn: null, drawCount: 0 };
        }
        shuffle() {
          const a = this.state.sel.slice();
          for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const t = a[i];
            a[i] = a[j];
            a[j] = t;
          }
          this.setState({ drawn: a, drawCount: this.state.drawCount + 1 });
        }
        renderVals() {
          const players = [
            { id: 'lea', name: 'Léa', nick: 'La Flèche', ini: 'L', color: '#D9261C' },
            { id: 'max', name: 'Maxime', nick: 'Max180', ini: 'M', color: '#0B8A3C' },
            { id: 'soph', name: 'Sophie', nick: 'Bullseye', ini: 'S', color: '#EFDCB0' },
            { id: 'jul', name: 'Julien', nick: 'Jules', ini: 'J', color: '#9A9A9A' },
          ];
          const sel = this.state.sel;
          const baseMode =
            'border-radius: 16px; padding: 18px 12px; min-height: 120px; text-align: center; ';
          const avatar = (color, size) =>
            'width: ' +
            size +
            'px; height: ' +
            size +
            'px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; background: #262626; box-shadow: inset 0 0 0 3px ' +
            color +
            '; color: #F4F1EA; font-family: Barlow Condensed, sans-serif; font-weight: 800; font-size: ' +
            Math.round(size * 0.45) +
            'px';
          const drawn = this.state.drawn || [];
          const cannot = sel.length < 1;
          return {
            showDraw: !!this.state.drawn,
            drawCount: this.state.drawCount,
            drawn: drawn.map((id, i) => {
              const p = players.find((x) => x.id === id);
              return {
                rank: i + 1,
                name: p.name,
                ini: p.ini,
                first: i === 0,
                avatarStyle: avatar(p.color, 40),
                rowStyle:
                  'display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; ' +
                  (i === 0
                    ? 'background: #241311; border: 2px solid #D9261C;'
                    : 'background: #1C1C1C; border: 2px solid #262626;'),
              };
            }),
            draw: () => this.shuffle(),
            closeDraw: () => this.setState({ drawn: null }),
            cannotLaunch: cannot,
            launchStyle:
              'display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 60px; border-radius: 14px; border: 0; background: #D9261C; color: #FFFFFF; font-family: Barlow Condensed, sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 0.06em; text-transform: uppercase; ' +
              (cannot ? 'opacity: 0.4; cursor: not-allowed;' : ''),
            mode: this.state.mode,
            selCount: sel.length,
            modes: ['301', '501'].map((id) => {
              const on = this.state.mode === id;
              return {
                id,
                pressed: on ? 'true' : 'false',
                pick: () => this.setState({ mode: id }),
                style:
                  baseMode +
                  (on
                    ? 'background: #D9261C; color: #FFFFFF; border: 2px solid #D9261C;'
                    : 'background: #181818; color: #EFDCB0; border: 2px solid #2E2E2E;'),
              };
            }),
            players: players.map((p) => {
              const idx = sel.indexOf(p.id);
              const on = idx >= 0;
              return {
                ...p,
                selected: on,
                unselected: !on,
                order: idx + 1,
                pressed: on ? 'true' : 'false',
                toggle: () =>
                  this.setState({ sel: on ? sel.filter((x) => x !== p.id) : [...sel, p.id] }),
                rowStyle:
                  'display: flex; align-items: center; gap: 14px; width: 100%; min-height: 68px; padding: 10px 14px; border-radius: 14px; text-align: left; box-sizing: border-box; ' +
                  (on
                    ? 'background: #1F1F1F; border: 2px solid #EFDCB0;'
                    : 'background: #161616; border: 2px solid #232323;'),
                avatarStyle:
                  'width: 46px; height: 46px; border-radius: 23px; flex: none; display: flex; align-items: center; justify-content: center; background: #262626; box-shadow: inset 0 0 0 3px ' +
                  p.color +
                  '; color: #F4F1EA; font-family: Barlow Condensed, sans-serif; font-weight: 800; font-size: 22px',
              };
            }),
          };
        }
      }
      window.__dcStart(Component);
    </script>
  </body>
</html>
