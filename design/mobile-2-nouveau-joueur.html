<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nouveau joueur · Dart Counter (maquette)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #0e0e0e;
      }
      a {
        color: #efdcb0;
      }
      a:hover {
        color: #ffffff;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      input::placeholder {
        color: #8a8a8a;
      }
      input:focus {
        outline: 2px solid #efdcb0;
        outline-offset: 1px;
      }
    </style>
    <style>
      #app {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <!-- Maquette Dart Counter : référence visuelle et comportementale, pas du code de production. -->
    <div id="app"></div>
    <template id="tpl">
      <div
        style="
          width: 390px;
          height: 844px;
          box-sizing: border-box;
          background: #0e0e0e;
          color: #f4f1ea;
          font-family: Barlow, sans-serif;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        "
      >
        <header style="display: flex; align-items: center; gap: 8px; padding: 24px 12px 8px">
          <a
            href="mobile-1-menu.html"
            aria-label="Retour au menu"
            style="
              width: 44px;
              height: 44px;
              display: flex;
              align-items: center;
              justify-content: center;
              border-radius: 22px;
              color: #efdcb0;
            "
          >
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M15 5l-7 7 7 7"></path>
            </svg>
          </a>
          <h1
            style="
              margin: 0;
              font-family: 'Barlow Condensed', sans-serif;
              font-weight: 800;
              font-size: 28px;
              letter-spacing: 0.04em;
              text-transform: uppercase;
              color: #efdcb0;
            "
          >
            Nouveau joueur
          </h1>
        </header>

        <main
          style="
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 16px 20px;
            overflow-y: auto;
          "
        >
          <div style="position: relative; width: 248px; height: 248px">
            <svg
              width="248"
              height="248"
              viewBox="0 0 248 248"
              aria-hidden="true"
              style="position: absolute; inset: 0"
            >
              <circle
                cx="124"
                cy="124"
                r="122"
                fill="none"
                stroke="#D9261C"
                stroke-width="4"
              ></circle>
              <circle
                cx="124"
                cy="124"
                r="114"
                fill="none"
                stroke="#0B8A3C"
                stroke-width="4"
                stroke-dasharray="18 18"
              ></circle>
            </svg>
            <div
              style="
                position: absolute;
                inset: 14px;
                border-radius: 50%;
                background: #1b1b1b;
                overflow: hidden;
                display: flex;
                align-items: flex-end;
                justify-content: center;
              "
            >
              <sc-if value="{{live}}" hint-placeholder-val="{{true}}">
                <svg
                  width="220"
                  height="200"
                  viewBox="0 0 220 200"
                  role="img"
                  aria-label="Aperçu caméra"
                >
                  <circle
                    cx="110"
                    cy="78"
                    r="44"
                    fill="#2A2A2A"
                    stroke="#4A4A4A"
                    stroke-width="2"
                    stroke-dasharray="6 6"
                  ></circle>
                  <path
                    d="M28 200c6-48 40-72 82-72s76 24 82 72"
                    fill="#2A2A2A"
                    stroke="#4A4A4A"
                    stroke-width="2"
                    stroke-dasharray="6 6"
                  ></path>
                </svg>
              </sc-if>
              <sc-if value="{{taken}}" hint-placeholder-val="{{false}}">
                <div
                  style="
                    width: 100%;
                    height: 100%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: #262626;
                    font-family: 'Barlow Condensed', sans-serif;
                    font-weight: 800;
                    font-size: 36px;
                    letter-spacing: 0.06em;
                    color: #efdcb0;
                  "
                >
                  [PHOTO]
                </div>
              </sc-if>
            </div>
            <span
              style="
                position: absolute;
                left: 50%;
                bottom: -6px;
                transform: translateX(-50%);
                background: #0e0e0e;
                padding: 2px 10px;
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: #9a9a9a;
                white-space: nowrap;
              "
              >{{caption}}</span
            >
          </div>

          <div
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 28px;
              margin-top: 6px;
            "
          >
            <button
              type="button"
              aria-label="Importer une photo"
              style="
                width: 52px;
                height: 52px;
                border-radius: 26px;
                background: #1b1b1b;
                border: 1px solid #333333;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #efdcb0;
              "
            >
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                <circle cx="9" cy="10" r="2"></circle>
                <path d="M21 16l-5-5-9 9"></path>
              </svg>
            </button>
            <button
              type="button"
              onClick="{{shoot}}"
              aria-label="{{shootLabel}}"
              style="
                width: 76px;
                height: 76px;
                border-radius: 38px;
                background: #efdcb0;
                border: 5px solid #0e0e0e;
                box-shadow: 0 0 0 3px #efdcb0;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #0e0e0e;
              "
            >
              <sc-if value="{{live}}" hint-placeholder-val="{{true}}">
                <span
                  style="width: 22px; height: 22px; border-radius: 11px; background: #d9261c"
                ></span>
              </sc-if>
              <sc-if value="{{taken}}" hint-placeholder-val="{{false}}">
                <svg
                  width="28"
                  height="28"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"></path>
                </svg>
              </sc-if>
            </button>
            <button
              type="button"
              aria-label="Changer de caméra"
              style="
                width: 52px;
                height: 52px;
                border-radius: 26px;
                background: #1b1b1b;
                border: 1px solid #333333;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #efdcb0;
              "
            >
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 8h3l2-3h8l2 3h3v11H3z"></path>
                <path d="M9 13a3 3 0 0 1 5-2.2M15 13a3 3 0 0 1-5 2.2"></path>
              </svg>
            </button>
          </div>

          <form
            style="width: 100%; display: flex; flex-direction: column; gap: 16px; margin-top: 8px"
          >
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label
                for="nom"
                style="
                  font-family: 'Barlow Condensed', sans-serif;
                  font-weight: 700;
                  font-size: 15px;
                  letter-spacing: 0.12em;
                  text-transform: uppercase;
                  color: #9a9a9a;
                "
                >Nom</label
              >
              <input
                id="nom"
                type="text"
                placeholder="Prénom du joueur"
                style="
                  height: 54px;
                  box-sizing: border-box;
                  padding: 0 16px;
                  border-radius: 12px;
                  border: 1px solid #333333;
                  background: #181818;
                  color: #f4f1ea;
                  font-family: Barlow, sans-serif;
                  font-size: 17px;
                "
              />
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label
                for="surnom"
                style="
                  font-family: 'Barlow Condensed', sans-serif;
                  font-weight: 700;
                  font-size: 15px;
                  letter-spacing: 0.12em;
                  text-transform: uppercase;
                  color: #9a9a9a;
                "
                >Surnom
                <span
                  style="
                    text-transform: none;
                    letter-spacing: 0;
                    font-family: Barlow, sans-serif;
                    font-weight: 500;
                  "
                  >(facultatif)</span
                ></label
              >
              <input
                id="surnom"
                type="text"
                placeholder="Ex. La Flèche"
                style="
                  height: 54px;
                  box-sizing: border-box;
                  padding: 0 16px;
                  border-radius: 12px;
                  border: 1px solid #333333;
                  background: #181818;
                  color: #f4f1ea;
                  font-family: Barlow, sans-serif;
                  font-size: 17px;
                "
              />
            </div>
          </form>
        </main>

        <footer style="padding: 12px 20px 28px; border-top: 1px solid #222222">
          <a
            href="mobile-1-menu.html"
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              min-height: 60px;
              border-radius: 14px;
              background: #0b8a3c;
              color: #ffffff;
              text-decoration: none;
              font-family: 'Barlow Condensed', sans-serif;
              font-weight: 800;
              font-size: 24px;
              letter-spacing: 0.06em;
              text-transform: uppercase;
            "
            >Enregistrer le joueur</a
          >
        </footer>
      </div>
    </template>
    <script>
      /* Mini runtime: renders a Design Component template (holes, sc-for, sc-if, events) as a standalone page. */
      (function () {
        var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
        var WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
        function lookup(path, scope) {
          if (path === 'true') return true;
          if (path === 'false') return false;
          if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
          var parts = path.split('.'),
            v = scope;
          for (var i = 0; i < parts.length; i++) {
            if (v == null) return undefined;
            v = v[parts[i]];
          }
          return v;
        }
        function interp(str, scope) {
          return str.replace(HOLE, function (_, p) {
            var v = lookup(p, scope);
            return v == null ? '' : String(v);
          });
        }
        function renderNodes(nodes, scope, out) {
          for (var i = 0; i < nodes.length; i++) renderNode(nodes[i], scope, out);
          return out;
        }
        function renderNode(node, scope, out) {
          if (node.nodeType === 3) {
            out.push(document.createTextNode(interp(node.nodeValue, scope)));
            return;
          }
          if (node.nodeType !== 1) return;
          var tag = node.localName;
          if (tag === 'sc-for') {
            var list =
              lookup((WHOLE.exec(node.getAttribute('list') || '') || [])[1] || '', scope) || [];
            var as = node.getAttribute('as') || 'item';
            list.forEach(function (item, idx) {
              var s = Object.create(scope);
              s[as] = item;
              s.$index = idx;
              renderNodes(node.childNodes, s, out);
            });
            return;
          }
          if (tag === 'sc-if') {
            var cond = lookup((WHOLE.exec(node.getAttribute('value') || '') || [])[1] || '', scope);
            if (cond) renderNodes(node.childNodes, scope, out);
            return;
          }
          var el =
            node.namespaceURI === 'http://www.w3.org/1999/xhtml'
              ? document.createElement(tag)
              : document.createElementNS(node.namespaceURI, node.tagName);
          for (var a = 0; a < node.attributes.length; a++) {
            var at = node.attributes[a],
              name = at.name,
              val = at.value;
            if (name.indexOf('hint-') === 0) continue;
            var m = WHOLE.exec(val);
            if (name.indexOf('on') === 0 && m) {
              var fn = lookup(m[1], scope);
              if (typeof fn === 'function') el.addEventListener(name.slice(2), fn);
              continue;
            }
            if (name === 'href' && /\.dc\.html$/.test(val))
              val = val.replace(/\.dc\.html$/, '.html');
            if (m) {
              var raw = lookup(m[1], scope);
              if (raw === false || raw == null) continue;
              el.setAttribute(name, raw === true ? '' : String(raw));
            } else {
              el.setAttribute(name, val.indexOf('{{') >= 0 ? interp(val, scope) : val);
            }
          }
          var src = tag === 'template' ? node.content.childNodes : node.childNodes;
          renderNodes(src, scope, []).forEach(function (c) {
            el.appendChild(c);
          });
          out.push(el);
        }
        var mount,
          tpl,
          inst,
          queued = false;
        function render() {
          queued = false;
          var vals = inst.renderVals();
          var nodes = renderNodes(tpl.content.childNodes, vals, []);
          mount.replaceChildren.apply(mount, nodes);
        }
        window.DCLogic = function DCLogic(props) {
          this.props = props || {};
          this.state = {};
        };
        window.DCLogic.prototype.setState = function (patch) {
          this.state = Object.assign(
            {},
            this.state,
            typeof patch === 'function' ? patch(this.state, this.props) : patch,
          );
          if (!queued) {
            queued = true;
            Promise.resolve().then(render);
          }
        };
        window.DCLogic.prototype.forceUpdate = function () {
          if (!queued) {
            queued = true;
            Promise.resolve().then(render);
          }
        };
        window.__dcStart = function (Component) {
          mount = document.getElementById('app');
          tpl = document.getElementById('tpl');
          inst = new Component({});
          render();
          if (inst.componentDidMount) inst.componentDidMount();
        };
      })();
    </script>
    <script>
      class Component extends DCLogic {
        constructor(props) {
          super(props);
          this.state = { taken: false };
        }
        renderVals() {
          const taken = this.state.taken;
          return {
            taken,
            live: !taken,
            caption: taken ? 'Photo enregistrée' : 'Cadrez votre visage',
            shootLabel: taken ? 'Reprendre la photo' : 'Prendre la photo',
            shoot: () => this.setState({ taken: !taken }),
          };
        }
      }
      window.__dcStart(Component);
    </script>
  </body>
</html>
