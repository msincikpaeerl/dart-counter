<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partie en cours · Dart Counter (maquette)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0E0E}
a{color:#EFDCB0}a:hover{color:#FFFFFF}
button{font:inherit;color:inherit;cursor:pointer}
.seg{cursor:pointer;transition:filter .12s}
.seg:hover{filter:brightness(1.3)}
.seg:active{filter:brightness(1.6)}
.tgt{stroke:#FFFFFF;stroke-width:2}
.blink{stroke:#FFFFFF;stroke-width:2.5;animation:blink .9s ease-in-out infinite}
@keyframes blink{0%,100%{}50%{fill:#FFFFFF}}
.chipnext{animation:chip .9s ease-in-out infinite}
@keyframes chip{0%,100%{background:#EFDCB0}50%{background:#FFFFFF}}
.padnext{animation:padb .9s ease-in-out infinite}
@keyframes padb{0%,100%{box-shadow:0 0 0 2px #EFDCB0}50%{box-shadow:0 0 0 3px #FFFFFF;background:#EFDCB0;color:#111111}}
button:disabled{cursor:not-allowed}
</style>
<style>#app{display:inline-block}</style>
</head>
<body>
<!-- Maquette Dart Counter : référence visuelle et comportementale, pas du code de production. -->
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E0E; color: #F4F1EA; font-family: Barlow, sans-serif; display: flex; flex-direction: column; gap: 10px; padding: 0 14px 20px; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 6px; padding-top: 20px">
    <a href="mobile-1-menu.html" aria-label="Quitter la partie" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px; color: #EFDCB0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 0.05em; text-transform: uppercase; color: #EFDCB0; line-height: 1.1">{{mode}} · Double out</span>
      <span style="font-size: 13px; color: #9A9A9A; font-weight: 600">Manche {{round}}</span>
    </div>
    <button type="button" onClick="{{undo}}" aria-label="Annuler la dernière fléchette" style="height: 44px; padding: 0 14px; border-radius: 22px; background: #1B1B1B; border: 1px solid #333333; display: flex; align-items: center; gap: 6px; color: #EFDCB0; font-weight: 600; font-size: 15px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg>
      Annuler
    </button>
  </header>

  <section aria-label="Joueur en cours" style="background: #181818; border: 2px solid #D9261C; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="{{curAvatar}}">{{curIni}}</span>
      <div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #FF5A4E">À toi de jouer</span>
        <span style="font-size: 22px; font-weight: 700; line-height: 1.15">{{curName}}</span>
      </div>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 72px; line-height: 0.9; color: #EFDCB0; font-variant-numeric: tabular-nums">{{remaining}}</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
        <span style="{{s.style}}">{{s.label}}</span>
      </sc-for>
      <span style="margin-left: auto; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; color: #9A9A9A; white-space: nowrap">= {{turnTotal}}</span>
    </div>
  </section>

  <section aria-label="Autres joueurs" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{others}}" as="o" hint-placeholder-count="2">
      <div style="display: flex; align-items: center; gap: 10px; background: #161616; border: 1px solid #262626; border-radius: 14px; padding: 8px 10px; min-width: 0">
        <span style="{{o.avatar}}">{{o.ini}}</span>
        <div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
          <span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{o.name}}</span>
          <span style="font-size: 12px; color: #9A9A9A">Dern. {{o.last}}</span>
        </div>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; color: #F4F1EA; font-variant-numeric: tabular-nums">{{o.score}}</span>
      </div>
    </sc-for>
  </section>

  <div style="min-height: 52px; display: flex">
    <sc-if value="{{showCheckout}}" hint-placeholder-val="{{true}}">
      <div role="status" style="flex: 1; display: flex; align-items: center; gap: 10px; background: #10301C; border: 2px solid #0B8A3C; border-radius: 14px; padding: 6px 12px">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: 0.1em; text-transform: uppercase; color: #7FE0A3">Finish</span>
        <div style="flex: 1; display: flex; gap: 6px; justify-content: flex-end">
          <sc-for list="{{combo}}" as="k" hint-placeholder-count="2">
            <span class="{{k.cls}}" style="{{k.style}}">{{k.label}}</span>
          </sc-for>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{showMsg}}" hint-placeholder-val="{{false}}">
      <div role="status" style="flex: 1; display: flex; align-items: center; justify-content: center; background: #3A0F0C; border: 2px solid #D9261C; border-radius: 14px; padding: 6px 12px; font-weight: 700; font-size: 17px; color: #FFD9D6">{{msg}}</div>
    </sc-if>
    <sc-if value="{{showHint}}" hint-placeholder-val="{{false}}">
      <div style="flex: 1; display: flex; align-items: center; justify-content: center; border: 1px dashed #333333; border-radius: 14px; font-size: 15px; color: #9A9A9A">{{hint}}</div>
    </sc-if>
  </div>

  <div role="group" aria-label="Mode de saisie" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #181818; border: 1px solid #2A2A2A; border-radius: 12px">
    <sc-for list="{{views}}" as="v" hint-placeholder-count="2">
      <button type="button" aria-pressed="{{v.pressed}}" onClick="{{v.pick}}" style="{{v.style}}">{{v.label}}</button>
    </sc-for>
  </div>

  <div style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0">
    <sc-if value="{{showPad}}" hint-placeholder-val="{{false}}">
      <div style="width: 100%; display: flex; flex-direction: column; gap: 8px">
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{mods}}" as="m" hint-placeholder-count="3">
            <button type="button" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" class="{{m.cls}}" style="{{m.style}}">{{m.label}}</button>
          </sc-for>
        </div>
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{keys}}" as="k" hint-placeholder-count="20">
            <button type="button" onClick="{{k.press}}" class="{{k.cls}}" aria-label="{{k.aria}}" style="{{k.style}}">{{k.label}}</button>
          </sc-for>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{bulls}}" as="k" hint-placeholder-count="2">
            <button type="button" onClick="{{k.press}}" disabled="{{k.disabled}}" class="{{k.cls}}" aria-label="{{k.aria}}" style="{{k.style}}">{{k.label}}</button>
          </sc-for>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{showBoard}}" hint-placeholder-val="{{true}}">
    <svg width="330" height="330" viewBox="-192 -192 384 384" role="group" aria-label="Cible : touchez une zone pour marquer">

(function () {

      list.forEach(function (item, idx) {

    }
    if (tag === 'sc-if') {
      var cond = lookup((WHOLE.exec(node.getAttribute('value') || '') || [])[1] || '', scope);
      if (cond) renderNodes(node.childNodes, scope, out);

      if (name.indexOf('on') === 0 && m) {
        var fn = lookup(m[1], scope);
        if (typeof fn === 'function') el.addEventListener(name.slice(2), fn);

(function () {
  for (var n = 1; n <= 20; n++) {
    THROWS.push({ label: String(n), val: n, keys: ['s' + n + 'i', 's' + n + 'o'], cost: 1 + (20 - n) * 0.01 });

  }
  THROWS.push({ label: '25', val: 25, keys: ['sb'], cost: 3 });
  THROWS.push({ label: 'BULL', val: 50, keys: ['db'], cost: 4 });
  DPREF.forEach(function (n, i) { FINISH[2 * n] = { label: 'D' + n, val: 2 * n, keys: ['d' + n], cost: i * 0.5 }; });
  FINISH[50] = { label: 'BULL', val: 50, keys: ['db'], cost: 9 };
})();
var MEMO = {};
function solve(rem, n) {
  if (rem > 170 || rem < 2 || n < 1) return null;
  var key = rem + ':' + n;
  if (key in MEMO) return MEMO[key];
  var best = null, bestCost = Infinity;
  function consider(list) {
    var c = list.length * 100;
    list.forEach(function (t) { c += t.cost; });
    if (c < bestCost) { bestCost = c; best = list; }
  }
  if (FINISH[rem]) consider([FINISH[rem]]);

        if (b.val > a.val) return;
        var f = FINISH[rem - a.val - b.val];

      });
