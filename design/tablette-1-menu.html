<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu de partie · tablette · Dart Counter (maquette)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0E0E}
a{color:#EFDCB0}a:hover{color:#FFFFFF}
button{font:inherit;color:inherit;cursor:pointer}
</style>
<style>#app{display:inline-block}</style>
</head>
<body>
<!-- Maquette Dart Counter : référence visuelle et comportementale, pas du code de production. -->
<div id="app"></div>
<template id="tpl">
<div style="position: relative; width: 1194px; height: 834px; box-sizing: border-box; background: #0E0E0E; color: #F4F1EA; font-family: Barlow, sans-serif; display: flex; gap: 32px; padding: 36px; overflow: hidden">

  <div style="width: 400px; flex: none; display: flex; flex-direction: column; gap: 32px">
    <header style="display: flex; align-items: center; gap: 14px">
      <svg width="52" height="52" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="19" fill="#151515" stroke="#3A3A3A" stroke-width="1"></circle>
        <circle cx="20" cy="20" r="15" fill="none" stroke="#D9261C" stroke-width="3"></circle>
        <circle cx="20" cy="20" r="9" fill="none" stroke="#0B8A3C" stroke-width="3"></circle>
        <circle cx="20" cy="20" r="3.5" fill="#D9261C"></circle>
      </svg>
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 46px; letter-spacing: 0.04em; line-height: 1; text-transform: uppercase; color: #EFDCB0">Dart<span style="color: #D9261C">Counter</span></h1>
    </header>

    <section style="display: flex; flex-direction: column; gap: 14px">
      <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.12em; text-transform: uppercase; color: #9A9A9A">Type de partie</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
          <button type="button" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" style="{{m.style}}">
            <span style="display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 84px; line-height: 1">{{m.id}}</span>
            <span style="display: block; font-size: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 8px; opacity: 0.85">Double out</span>
          </button>
        </sc-for>
      </div>
    </section>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 16px; color: #9A9A9A">{{summary}}</span>
      <span style="font-size: 15px; color: #9A9A9A">L'ordre de passage est tiré au sort au lancement</span>
      <button type="button" onClick="{{draw}}" disabled="{{cannotLaunch}}" style="{{launchStyle}}">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"></rect><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"></circle><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"></circle><circle cx="12" cy="12" r="1.2" fill="currentColor"></circle></svg>
        Tirer au sort · {{mode}}
      </button>
    </div>
  </div>

  <section style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; background: #131313; border: 1px solid #222222; border-radius: 24px; padding: 28px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.12em; text-transform: uppercase; color: #9A9A9A">Joueurs</h2>
      <span style="font-size: 16px; color: #EFDCB0; font-weight: 600">{{selCount}} sélectionnés</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
      <sc-for list="{{players}}" as="p" hint-placeholder-count="4">
        <button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.toggle}}" style="{{p.rowStyle}}">
          <span style="{{p.avatarStyle}}">{{p.ini}}</span>
          <span style="flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0">
            <span style="font-size: 22px; font-weight: 600">{{p.name}}</span>
            <span style="font-size: 15px; color: #9A9A9A">« {{p.nick}} »</span>
          </span>
          <sc-if value="{{p.selected}}" hint-placeholder-val="{{true}}">
            <span style="width: 40px; height: 40px; border-radius: 20px; background: #D9261C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
          </sc-if>
          <sc-if value="{{p.unselected}}" hint-placeholder-val="{{false}}">
            <span style="width: 40px; height: 40px; border-radius: 20px; border: 2px solid #4A4A4A; box-sizing: border-box"></span>
          </sc-if>
        </button>
      </sc-for>
      <a href="tablette-2-nouveau-joueur.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 96px; border: 2px dashed #4A4A4A; border-radius: 18px; color: #EFDCB0; text-decoration: none; font-weight: 600; font-size: 19px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Créer un joueur
      </a>
    </div>
  </section>

  <sc-if value="{{showDraw}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.72); display: flex; align-items: center; justify-content: center">
      <div role="dialog" aria-label="Ordre de passage" style="width: 560px; box-sizing: border-box; background: #161616; border: 2px solid #D9261C; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 38px; letter-spacing: 0.04em; text-transform: uppercase; color: #EFDCB0">Ordre de passage</h2>
          <span style="font-size: 15px; color: #9A9A9A; font-weight: 600">Tirage n° {{drawCount}}</span>
        </div>
        <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
          <sc-for list="{{drawn}}" as="d" hint-placeholder-count="3">
            <li style="{{d.rowStyle}}">
              <span style="width: 36px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 40px; color: #EFDCB0; text-align: center">{{d.rank}}</span>
              <span style="{{d.avatarStyle}}">{{d.ini}}</span>
              <span style="flex: 1; font-size: 22px; font-weight: 600">{{d.name}}</span>
              <sc-if value="{{d.first}}" hint-placeholder-val="{{false}}">
                <span style="padding: 6px 12px; border-radius: 8px; background: #D9261C; color: #FFFFFF; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Commence</span>
              </sc-if>
            </li>
          </sc-for>
        </ol>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 8px">
          <button type="button" onClick="{{draw}}" style="min-height: 64px; border-radius: 16px; background: #1F1F1F; border: 1px solid #3A3A3A; color: #EFDCB0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 0.05em; text-transform: uppercase">Relancer le tirage</button>
          <a href="tablette-3-partie.html" style="display: flex; align-items: center; justify-content: center; min-height: 64px; border-radius: 16px; background: #D9261C; color: #FFFFFF; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 0.05em; text-transform: uppercase">C'est parti</a>
        </div>
        <button type="button" onClick="{{closeDraw}}" style="min-height: 48px; background: transparent; border: 0; color: #9A9A9A; font-size: 17px; font-weight: 600">Modifier la sélection</button>
      </div>
    </div>
  </sc-if>
</div>
</template>
<script>
/* Mini runtime: renders a Design Component template (holes, sc-for, sc-if, events) as a standalone page. */
(function () {
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  function lookup(path, scope) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function renderNodes(nodes, scope, out) {
    for (var i = 0; i < nodes.length; i++) renderNode(nodes[i], scope, out);
    return out;
  }
  function renderNode(node, scope, out) {
    if (node.nodeType === 3) { out.push(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var list = lookup((WHOLE.exec(node.getAttribute('list') || '') || [])[1] || '', scope) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, idx) {
        var s = Object.create(scope); s[as] = item; s.$index = idx;
        renderNodes(node.childNodes, s, out);
      });
      return;
    }
    if (tag === 'sc-if') {
      var cond = lookup((WHOLE.exec(node.getAttribute('value') || '') || [])[1] || '', scope);
      if (cond) renderNodes(node.childNodes, scope, out);
      return;
    }
    var el = node.namespaceURI === 'http://www.w3.org/1999/xhtml'
      ? document.createElement(tag)
      : document.createElementNS(node.namespaceURI, node.tagName);
    for (var a = 0; a < node.attributes.length; a++) {
      var at = node.attributes[a], name = at.name, val = at.value;
      if (name.indexOf('hint-') === 0) continue;
      var m = WHOLE.exec(val);
      if (name.indexOf('on') === 0 && m) {
        var fn = lookup(m[1], scope);
        if (typeof fn === 'function') el.addEventListener(name.slice(2), fn);
        continue;
      }
      if (name === 'href' && /\.dc\.html$/.test(val)) val = val.replace(/\.dc\.html$/, '.html');
      if (m) {
        var raw = lookup(m[1], scope);
        if (raw === false || raw == null) continue;
        el.setAttribute(name, raw === true ? '' : String(raw));
      } else {
        el.setAttribute(name, val.indexOf('{{') >= 0 ? interp(val, scope) : val);
      }
    }
    var src = tag === 'template' ? node.content.childNodes : node.childNodes;
    renderNodes(src, scope, []).forEach(function (c) { el.appendChild(c); });
    out.push(el);
  }
  var mount, tpl, inst, queued = false;
  function render() {
    queued = false;
    var vals = inst.renderVals();
    var nodes = renderNodes(tpl.content.childNodes, vals, []);
    mount.replaceChildren.apply(mount, nodes);
  }
  window.DCLogic = function DCLogic(props) { this.props = props || {}; this.state = {}; };
  window.DCLogic.prototype.setState = function (patch) {
    this.state = Object.assign({}, this.state, typeof patch === 'function' ? patch(this.state, this.props) : patch);
    if (!queued) { queued = true; Promise.resolve().then(render); }
  };
  window.DCLogic.prototype.forceUpdate = function () { if (!queued) { queued = true; Promise.resolve().then(render); } };
  window.__dcStart = function (Component) {
    mount = document.getElementById('app');
    tpl = document.getElementById('tpl');
    inst = new Component({});
    render();
    if (inst.componentDidMount) inst.componentDidMount();
  };
})();

</script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: '501', sel: ['lea', 'max', 'soph'], drawn: null, drawCount: 0 };
  }
  shuffle() {
    const a = this.state.sel.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    this.setState({ drawn: a, drawCount: this.state.drawCount + 1 });
  }
  renderVals() {
    const players = [
      { id: 'lea', name: 'Léa', nick: 'La Flèche', ini: 'L', color: '#D9261C' },
      { id: 'max', name: 'Maxime', nick: 'Max180', ini: 'M', color: '#0B8A3C' },
      { id: 'soph', name: 'Sophie', nick: 'Bullseye', ini: 'S', color: '#EFDCB0' },
      { id: 'jul', name: 'Julien', nick: 'Jules', ini: 'J', color: '#9A9A9A' },
      { id: 'tom', name: 'Thomas', nick: 'Tom', ini: 'T', color: '#9A9A9A' }
    ];
    const sel = this.state.sel;
    const names = sel.map((id) => players.find((p) => p.id === id).name);
    const baseMode = 'border-radius: 20px; padding: 26px 12px; min-height: 170px; text-align: center; ';
    const avatar = (color, size) => 'width: ' + size + 'px; height: ' + size + 'px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; background: #262626; box-shadow: inset 0 0 0 3px ' + color + '; color: #F4F1EA; font-family: Barlow Condensed, sans-serif; font-weight: 800; font-size: ' + Math.round(size * 0.45) + 'px';
    const drawn = this.state.drawn || [];
    const cannot = sel.length < 1;
    return {
      showDraw: !!this.state.drawn,
      drawCount: this.state.drawCount,
      drawn: drawn.map((id, i) => {
        const p = players.find((x) => x.id === id);
        return {
          rank: i + 1, name: p.name, ini: p.ini, first: i === 0,
          avatarStyle: avatar(p.color, 52),
          rowStyle: 'display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-radius: 16px; ' + (i === 0 ? 'background: #241311; border: 2px solid #D9261C;' : 'background: #1C1C1C; border: 2px solid #262626;')
        };
      }),
      draw: () => this.shuffle(),
      closeDraw: () => this.setState({ drawn: null }),
      cannotLaunch: cannot,
      launchStyle: 'display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 72px; border-radius: 16px; border: 0; background: #D9261C; color: #FFFFFF; font-family: Barlow Condensed, sans-serif; font-weight: 800; font-size: 30px; letter-spacing: 0.06em; text-transform: uppercase; ' + (cannot ? 'opacity: 0.4; cursor: not-allowed;' : ''),
      mode: this.state.mode,
      selCount: sel.length,
      summary: names.length ? 'Joueurs : ' + names.join(', ') : 'Sélectionnez au moins un joueur',
      modes: ['301', '501'].map((id) => {
        const on = this.state.mode === id;
        return {
          id, pressed: on ? 'true' : 'false',
          pick: () => this.setState({ mode: id }),
          style: baseMode + (on ? 'background: #D9261C; color: #FFFFFF; border: 2px solid #D9261C;' : 'background: #181818; color: #EFDCB0; border: 2px solid #2E2E2E;')
        };
      }),
      players: players.map((p) => {
        const idx = sel.indexOf(p.id);
        const on = idx >= 0;
        return {
          ...p, selected: on, unselected: !on, order: idx + 1,
          pressed: on ? 'true' : 'false',
          toggle: () => this.setState({ sel: on ? sel.filter((x) => x !== p.id) : [...sel, p.id] }),
          rowStyle: 'display: flex; align-items: center; gap: 16px; width: 100%; min-height: 96px; padding: 14px 18px; border-radius: 18px; text-align: left; box-sizing: border-box; ' + (on ? 'background: #1F1F1F; border: 2px solid #EFDCB0;' : 'background: #181818; border: 2px solid #262626;'),
          avatarStyle: 'width: 64px; height: 64px; border-radius: 32px; flex: none; display: flex; align-items: center; justify-content: center; background: #262626; box-shadow: inset 0 0 0 4px ' + p.color + '; color: #F4F1EA; font-family: Barlow Condensed, sans-serif; font-weight: 800; font-size: 30px'
        };
      })
    };
  }
}
window.__dcStart(Component);
</script>
</body>
</html>
