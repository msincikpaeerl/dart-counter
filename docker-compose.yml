# Two services only: the app and PostgreSQL. Configuration comes from the .env file
# (copy .env.example to .env); every variable has a default so the file is optional.
services:
  app:
    build: .
    ports:
      - '${PORT:-3000}:3000'
    environment:
      PORT: '3000'
      DATABASE_URL: postgres://${POSTGRES_USER:-dart}:${POSTGRES_PASSWORD:-dart}@db:5432/${POSTGRES_DB:-dart}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dart}
      POSTGRES_DB: ${POSTGRES_DB:-dart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  uploads:
  pgdata:
