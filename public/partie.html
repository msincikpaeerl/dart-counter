<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Partie · Dart Counter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/menu.css" />
    <link rel="stylesheet" href="/static/partie.css" />
  </head>
  <body>
    <main class="game" id="game" hidden>
      <header class="head">
        <a class="icon-btn" href="/" aria-label="Quitter la partie">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M15 5l-7 7 7 7"></path>
          </svg>
        </a>
        <div class="head-title">
          <span class="mode" id="mode"></span>
          <span class="round" id="round"></span>
        </div>
        <button type="button" class="undo" id="undo" aria-label="Annuler la dernière fléchette">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9 14L4 9l5-5"></path>
            <path d="M4 9h11a5 5 0 0 1 0 10h-3"></path>
          </svg>
          Annuler
        </button>
      </header>

      <section
        class="battle-teams"
        id="battle-teams"
        aria-label="Points de vie des équipes"
        hidden
      ></section>

      <section class="current" aria-label="Joueur en cours">
        <div class="current-top">
          <span id="cur-avatar"></span>
          <div class="current-name">
            <span class="your-turn">À toi de jouer</span>
            <span class="name" id="cur-name"></span>
          </div>
          <span class="big-score" id="cur-score"></span>
        </div>
        <div class="slots">
          <span class="slot" id="slot-0"></span>
          <span class="slot" id="slot-1"></span>
          <span class="slot" id="slot-2"></span>
          <span class="total" id="total"></span>
        </div>
      </section>

      <section class="others" aria-label="Autres joueurs">
        <h2>Prochains joueurs</h2>
        <div class="others-list" id="others"></div>
      </section>

      <div class="status" id="status" role="status"></div>

      <div class="input">
        <div class="switch" role="group" aria-label="Mode de saisie">
          <button type="button" id="view-board" aria-pressed="true">Cible</button>
          <button type="button" id="view-pad" aria-pressed="false">Pavé numérique</button>
        </div>

        <div class="pad" id="pad" hidden>
          <div class="pad-mods">
            <button type="button" class="mod" data-mod="1" aria-pressed="true">Simple</button>
            <button type="button" class="mod" data-mod="2" aria-pressed="false">Double</button>
            <button type="button" class="mod" data-mod="3" aria-pressed="false">Triple</button>
          </div>
          <div class="pad-keys" id="pad-keys"></div>
          <div class="pad-bulls">
            <button type="button" class="key bull25" id="key-25">25</button>
            <button type="button" class="key bull50" id="key-bull" aria-label="Bull 50">
              Bull · 50
            </button>
          </div>
        </div>

        <div class="board-wrap" id="board-wrap">
          <svg
            id="board"
            viewBox="-192 -192 384 384"
            role="group"
            aria-label="Cible : touchez une zone pour marquer"
          ></svg>
        </div>

        <div class="overlay" id="winner" role="dialog" aria-label="Fin de partie" hidden>
          <span class="shot">Game shot !</span>
          <span class="winner-name" id="winner-name"></span>
          <button type="button" class="replay" id="replay">Rejouer</button>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="miss" id="miss">Raté · 0</button>
        <button type="button" class="next" id="next">Joueur suivant</button>
      </div>
    </main>
    <p id="error" class="load-error muted" role="status">Chargement…</p>
    <script src="/static/keypad.js"></script>
    <script src="/static/partie.js"></script>
  </body>
</html>
