<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Joueurs · Dart Counter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/joueurs.css" />
  </head>
  <body>
    <!-- Liste des joueurs -->
    <div id="list-view" class="screen">
      <header class="top">
        <a class="back" href="/" aria-label="Retour au menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        </a>
        <h1>Joueurs</h1>
      </header>
      <main class="list-main">
        <p id="list-empty" class="muted" hidden>Aucun joueur pour l’instant.</p>
        <ul id="player-list" class="player-list"></ul>
      </main>
      <footer class="bottom">
        <button type="button" id="new-player" class="cta">Nouveau joueur</button>
      </footer>
    </div>

    <!-- Création / modification d'un joueur -->
    <div id="form-view" class="screen" hidden>
      <header class="top">
        <button type="button" id="form-back" class="back" aria-label="Retour à la liste">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <h1 id="form-title">Nouveau joueur</h1>
      </header>

      <form id="player-form" class="form-layout" novalidate>
        <section class="photo-section" aria-label="Photo du joueur">
          <div class="ring-box">
            <svg class="ring" viewBox="0 0 248 248" aria-hidden="true">
              <circle cx="124" cy="124" r="122" class="ring-red" />
              <circle cx="124" cy="124" r="114" class="ring-green" />
            </svg>
            <div class="photo-circle">
              <video id="video" autoplay playsinline muted hidden></video>
              <img id="preview" alt="Photo du joueur" hidden />
              <span id="initial" class="initial" aria-hidden="true"></span>
            </div>
            <span id="caption" class="caption"></span>
          </div>

          <div class="photo-controls">
            <button type="button" id="gallery" class="round" aria-label="Importer une photo">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="2" />
                <circle cx="9" cy="10" r="2" />
                <path d="M21 16l-5-5-9 9" />
              </svg>
            </button>
            <button type="button" id="shutter" class="shutter" aria-label="Prendre la photo">
              <span id="shutter-dot" class="dot"></span>
              <svg id="shutter-retake" viewBox="0 0 24 24" aria-hidden="true" hidden>
                <path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4" />
              </svg>
            </button>
            <button type="button" id="switch-camera" class="round" aria-label="Changer de caméra">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 8h3l2-3h8l2 3h3v11H3z" />
                <path d="M9 13a3 3 0 0 1 5-2.2M15 13a3 3 0 0 1-5 2.2" />
              </svg>
            </button>
          </div>
          <button type="button" id="remove-photo" class="link" hidden>Supprimer la photo</button>
          <input type="file" id="file-camera" accept="image/*" capture="user" hidden />
          <input type="file" id="file-gallery" accept="image/*" hidden />
        </section>

        <section class="info-section" aria-label="Informations du joueur">
          <div class="field">
            <label for="name">Nom</label>
            <input
              id="name"
              name="name"
              type="text"
              maxlength="40"
              placeholder="Prénom du joueur"
              autocomplete="off"
            />
          </div>
          <div class="field">
            <label for="nickname">Surnom <span>(facultatif)</span></label>
            <input
              id="nickname"
              name="nickname"
              type="text"
              maxlength="40"
              placeholder="Ex. La Flèche"
              autocomplete="off"
            />
          </div>
          <div class="field">
            <label class="check" for="double-out">
              <input id="double-out" name="doubleOut" type="checkbox" />
              Double out forcé
            </label>
            <p class="muted">
              Sans cette option, n’importe quelle fléchette qui amène le score à zéro gagne.
            </p>
          </div>
          <p id="error" class="error" role="alert" hidden></p>
          <div class="actions">
            <button type="submit" id="save" class="cta">Enregistrer le joueur</button>
            <button type="button" id="cancel" class="cancel">Annuler</button>
          </div>
        </section>
      </form>
    </div>

    <script src="/static/joueurs.js"></script>
  </body>
</html>
