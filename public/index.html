<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dart Counter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/menu.css" />
  </head>
  <body>
    <div class="screen" id="setup">
      <div class="left">
        <header class="brand">
          <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="20" r="19" class="l-board" />
            <circle cx="20" cy="20" r="15" class="l-red" />
            <circle cx="20" cy="20" r="9" class="l-green" />
            <circle cx="20" cy="20" r="3.5" class="l-bull" />
          </svg>
          <h1>Dart<span>Counter</span></h1>
        </header>

        <section class="block">
          <h2>Type de partie</h2>
          <div class="modes" id="game-types">
            <button type="button" class="mode" data-type="x01" aria-pressed="true">
              <span class="mode-num">X01</span><span class="mode-sub">301 · 501 · 701</span>
            </button>
          </div>
        </section>

        <section class="block" id="x01-options" aria-label="Options X01">
          <h2>Options</h2>
          <h3>Score de départ</h3>
          <div class="modes three" id="modes">
            <button type="button" class="mode compact" data-mode="301" aria-pressed="false">
              <span class="mode-num">301</span>
            </button>
            <button type="button" class="mode compact" data-mode="501" aria-pressed="true">
              <span class="mode-num">501</span>
            </button>
            <button type="button" class="mode compact" data-mode="701" aria-pressed="false">
              <span class="mode-num">701</span>
            </button>
          </div>
          <h3>Finish</h3>
          <div class="modes finish" id="finishes">
            <button type="button" class="mode" data-double-out="false" aria-pressed="true">
              Simple out
            </button>
            <button type="button" class="mode" data-double-out="true" aria-pressed="false">
              Double out
            </button>
          </div>
        </section>

        <footer class="launch">
          <span class="hint">L’ordre de passage est tiré au sort au lancement</span>
          <button type="button" id="draw" class="cta" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="4" />
              <circle cx="8.5" cy="8.5" r="1.2" fill="currentColor" />
              <circle cx="15.5" cy="15.5" r="1.2" fill="currentColor" />
              <circle cx="12" cy="12" r="1.2" fill="currentColor" />
            </svg>
            <span id="draw-label">Tirer au sort · 501</span>
          </button>
        </footer>
      </div>

      <main class="right">
        <div class="players-head">
          <h2>Joueurs</h2>
          <span id="sel-count" class="count">0 sélectionné</span>
        </div>
        <p id="empty" class="muted" hidden>
          Aucun joueur pour l’instant. Créez-en un pour commencer.
        </p>
        <ul id="players" class="players"></ul>
        <a class="create" href="/joueurs">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          Créer un joueur
        </a>
        <a class="create" href="/statistiques">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7" /></svg>
          Statistiques et historique
        </a>
      </main>
    </div>

    <div id="overlay" class="overlay" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-label="Ordre de passage">
        <div class="dialog-head">
          <h2>Ordre de passage</h2>
          <span id="draw-count" class="draw-count"></span>
        </div>
        <ol id="order" class="order"></ol>
        <p id="start-error" class="error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button type="button" id="redraw" class="btn-secondary">Relancer</button>
          <button type="button" id="start" class="btn-primary">C’est parti</button>
        </div>
        <button type="button" id="close" class="btn-link">Modifier la sélection</button>
      </div>
    </div>

    <div id="resume-overlay" class="overlay" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="resume-title">
        <div class="dialog-head">
          <h2 id="resume-title">Partie en cours</h2>
          <span id="resume-mode" class="draw-count"></span>
        </div>
        <p id="resume-summary" class="muted"></p>
        <p id="resume-error" class="error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button type="button" id="abandon" class="btn-secondary">Abandonner</button>
          <button type="button" id="resume" class="btn-primary">Reprendre la partie</button>
        </div>
      </div>
    </div>

    <script src="/static/menu.js"></script>
  </body>
</html>
